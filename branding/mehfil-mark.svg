<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mehfil app icon · brand mesh (indigo · magenta · ruby · lavender) under a gold ribbon M with a sparkle. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B32B8"/>
      <stop offset="1" stop-color="#1C1E54"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.72">
      <stop offset="0.55" stop-color="#0D253D" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D253D" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.45" stop-color="#F4CD5A"/>
      <stop offset="1" stop-color="#C98A1F"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="mesh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="95"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0D253D" flood-opacity="0.5"/>
    </filter>
    <clipPath id="square"><rect width="1024" height="1024"/></clipPath>
  </defs>

  <g clip-path="url(#square)">

  <g id="mark-layer">
    <!-- ribbon M -->
    <g filter="url(#shadow)">
      <path d="M262 712 V330 L512 618 L762 330 V712" fill="none" stroke="url(#gold)" stroke-width="76" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <path d="M262 712 V330 L512 618 L762 330 V712" fill="none" stroke="url(#goldEdge)" stroke-width="76" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- sparkle -->
    <path d="M818 192 C826 236 842 252 886 260 C842 268 826 284 818 328 C810 284 794 268 750 260 C794 252 810 236 818 192 Z" fill="#FFF0B8"/>
    <path d="M300 236 C304 258 312 266 334 270 C312 274 304 282 300 304 C296 282 288 274 266 270 C288 266 296 258 300 236 Z" fill="#FFF0B8" fill-opacity="0.9"/>
  </g>
  </g>
</svg>
