<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mehfil app icon. A rani-pink ground; the M is one ribbon whose second half folds into gold — rani and
       gold, the pairing of an Indian wedding, and the one warm note the brand spends. Geometry is a splayed capital M so it
       still reads at 48px; the fold sits on the centre join, where a round cap hides the seam. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#DD4987"/>
      <stop offset="1" stop-color="#A71C56"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF3CE"/>
      <stop offset="0.55" stop-color="#F5CE75"/>
      <stop offset="1" stop-color="#DCA53C"/>
    </linearGradient>
    <clipPath id="square"><rect width="1024" height="1024"/></clipPath>
  </defs>

  <g clip-path="url(#square)">
  <g id="ground-layer">
    <rect width="1024" height="1024" fill="url(#ground)"/>
  </g>

  <g id="mark-layer">
    <path d="M232 750 L288 356 L512 634" fill="none" stroke="#FFFFFF" stroke-width="82" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M512 634 L736 356 L792 750" fill="none" stroke="url(#gold)" stroke-width="82" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
